name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun test
      - name: Verify release version
        run: test "v$(jq -r .version extension/manifest.json)" = "$GITHUB_REF_NAME"
      - name: Package extension
        run: cd extension && zip -r ../bookmark-mirror.zip .
      - name: Publish installable artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" bookmark-mirror.zip --generate-notes
